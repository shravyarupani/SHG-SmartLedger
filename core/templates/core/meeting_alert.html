{% extends "core/base_leader_dashboard.html" %}

{% block title %}SHG SmartLedger - Meeting Alert{% endblock %}

{% block content %}
<div class="page-top-nav">
    <a href="{% url 'core:leader_home' %}" class="back-link-simple">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back
    </a>
</div>

<div class="page-header">
    <h2 class="page-title">Meeting Alert</h2>
</div>

<p class="page-subtitle">Send a meeting alert to all members of {{ member.shg_group.name|default:"Yashoda Mahila Sangham" }}.</p>

<div class="form-card-large">
    <form action="" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label">Meeting Title</label>
            <input type="text" name="title" class="form-input" value="Monthly Group Meeting" required />
        </div>

        <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-input" required />
        </div>

        <div class="form-group">
            <label class="form-label">Time</label>
            <input type="time" name="time" class="form-input" value="16:00" required />
        </div>

        <div class="form-group">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-input form-textarea" rows="4" required>Reminder for our monthly group meeting. Please join on time. Agenda includes savings collection, loan status, and upcoming events.</textarea>
        </div>

        <button type="submit" class="submit-btn-success">Send Alert</button>
    </form>
</div>
{% endblock %}
